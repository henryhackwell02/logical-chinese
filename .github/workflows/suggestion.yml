name: Suggestion

# One pass over a reader contribution — a better mnemonic for an existing
# reading (label `mnemonic`) or a character the dictionary does not have yet
# (label `new-character`). Validate it, then either land it or park it.
#
#   Filed by you, or anyone else with write access  ->  applied and deployed now.
#   Filed by anyone else                            ->  validated, labelled, and
#                                                       held until a maintainer
#                                                       adds the `approved` label.
#
# The repository is public, so the second path matters: without it anyone could
# commit to the live dictionary. `author_association` is set by GitHub from the
# filer's real permissions and cannot be spoofed by issue content.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

# One contribution lands at a time, so two can never race on the same file.
concurrency:
  group: suggestion-apply
  cancel-in-progress: false

jobs:
  handle:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'mnemonic') ||
       contains(github.event.issue.labels.*.name, 'new-character')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Issue bodies are untrusted input: they travel via the environment and a
      # file, and are never interpolated into a shell command.
      - name: Write the issue body to a file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/body.md"

      - name: Choose the handler
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          if printf '%s' "$LABELS" | grep -q '"new-character"'; then
            echo "kind=add" >> "$GITHUB_OUTPUT"
            echo "script=scripts/add-entry.mjs" >> "$GITHUB_OUTPUT"
            echo "noun=character" >> "$GITHUB_OUTPUT"
          else
            echo "kind=update" >> "$GITHUB_OUTPUT"
            echo "script=scripts/apply-suggestion.mjs" >> "$GITHUB_OUTPUT"
            echo "noun=suggestion" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        id: validate
        continue-on-error: true
        env:
          SCRIPT: ${{ steps.kind.outputs.script }}
        run: node "$SCRIPT" --body-file "$RUNNER_TEMP/body.md"

      - name: Decide whether it can land now
        id: gate
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          trusted=false
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) trusted=true ;;
          esac
          if [ "$ACTION" = "labeled" ] && [ "$LABEL" = "approved" ]; then
            trusted=true
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
          echo "author_association=$ASSOCIATION, landing now: $trusted"

      # ---------------------------------------------------------------- rejected

      - name: Report a contribution that cannot be applied
        if: steps.validate.outputs.ok != 'true'
        uses: actions/github-script@v7
        env:
          MESSAGE: ${{ steps.validate.outputs.message }}
        with:
          script: |
            const message = process.env.MESSAGE || 'The form could not be read.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '**This needs a change before it can be applied.**',
                '',
                '> ' + message.split('\n').join('\n> '),
                '',
                'Edit the issue and it will be rechecked automatically.',
              ].join('\n'),
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-changes'],
            });
            await github.rest.issues
              .removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'applies-cleanly',
              })
              .catch(() => {});

      - name: Stop here if it was rejected
        if: steps.validate.outputs.ok != 'true'
        run: exit 1

      # ------------------------------------------------- valid, but not yet trusted

      - name: Hold it for approval
        if: steps.gate.outputs.trusted != 'true'
        uses: actions/github-script@v7
        env:
          MESSAGE: ${{ steps.validate.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '**This applies cleanly.**',
                '',
                '```',
                process.env.MESSAGE,
                '```',
                '',
                'A maintainer can land it by adding the `approved` label — that commits the',
                'change and the site redeploys on its own.',
              ].join('\n'),
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['applies-cleanly'],
            });
            await github.rest.issues
              .removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'needs-changes',
              })
              .catch(() => {});

      # ------------------------------------------------------------------- landing

      # Apply, check and commit together, on a fresh copy of main each attempt.
      # If another contribution lands first the push is rejected, and the whole
      # edit is redone on top of it rather than rebased — an insertion and an
      # edit near each other would otherwise conflict.
      - name: Land it
        if: steps.gate.outputs.trusted == 'true'
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          SCRIPT: ${{ steps.kind.outputs.script }}
          SUMMARY: ${{ steps.validate.outputs.message }}
          CHAR: ${{ steps.validate.outputs.char }}
          PINYIN: ${{ steps.validate.outputs.pinyin }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$KIND" = "add" ]; then
            title="Add $CHAR $PINYIN to the dictionary"
          else
            title="Update $CHAR $PINYIN from a suggestion"
          fi
          printf '%s\n\n%s\n\nCloses #%s\nSuggested-by: @%s\n' \
            "$title" "$SUMMARY" "$ISSUE_NUMBER" "$ISSUE_USER" > "$RUNNER_TEMP/msg.txt"

          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main

            node "$SCRIPT" --body-file "$RUNNER_TEMP/body.md" --write
            node scripts/check-data.mjs

            # An edit rewrites exactly one line. An addition inserts exactly one,
            # or — when it lands at the very end of the file — also adds the
            # comma to the line before it.
            shape=$(git diff --numstat -- data/entries.json | awk '{print $1" "$2}')
            case "$KIND:$shape" in
              "update:1 1"|"add:1 0"|"add:2 1") ;;
              *) echo "unexpected diff shape for $KIND: '$shape'"; exit 1 ;;
            esac
            if [ -n "$(git diff --name-only -- . ':!data/entries.json')" ]; then
              echo "unexpected changes outside data/entries.json"; exit 1
            fi

            git add data/entries.json
            git commit -q -F "$RUNNER_TEMP/msg.txt"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main moved while this ran; redoing the edit on top of it"
            sleep 5
          done
          exit 1

      - name: Say it has landed
        if: steps.gate.outputs.trusted == 'true' && success()
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.validate.outputs.message }}
          KIND: ${{ steps.kind.outputs.kind }}
        with:
          script: |
            const headline =
              process.env.KIND === 'add'
                ? '**Added to the dictionary and pushed to `main`.**'
                : '**Applied and pushed to `main`.**';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                headline,
                '',
                '```',
                process.env.SUMMARY,
                '```',
                '',
                'The site redeploys from that commit, so it will be live shortly.',
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Say it could not land
        if: failure() && steps.validate.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                '**Could not apply this automatically.** See the run log linked above. ' +
                'Nothing was committed, so the dictionary is untouched.',
            });
            await github.rest.issues
              .removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'approved',
              })
              .catch(() => {});
