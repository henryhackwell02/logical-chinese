name: Apply suggestion

# Lands an approved suggestion: rewrites the one line in data/entries.json,
# commits it to main, and closes the issue. Vercel redeploys from the commit,
# so the change is live a couple of minutes later.
#
# The `approved` label is the gate. Only accounts with write access can add a
# label, so this cannot be triggered by whoever filed the issue.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-suggestion
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write the issue body to a file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/body.md

      - name: Apply it to data/entries.json
        id: apply
        run: node scripts/apply-suggestion.mjs --body-file /tmp/body.md --write

      - name: Re-check the data
        run: node scripts/check-data.mjs

      - name: Confirm only one line moved
        run: |
          changed=$(git diff --numstat -- data/entries.json)
          echo "$changed"
          test "$(echo "$changed" | awk '{print $1" "$2}')" = "1 1" \
            || { echo "expected exactly one line added and one removed"; exit 1; }
          test -z "$(git diff --name-only -- . ':!data/entries.json')" \
            || { echo "unexpected changes outside data/entries.json"; exit 1; }

      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          SUMMARY: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entries.json
          printf '%s\n\n%s\n\nCloses #%s\nSuggested-by: @%s\n' \
            "Update ${{ steps.apply.outputs.char }} ${{ steps.apply.outputs.pinyin }} from a reader suggestion" \
            "$SUMMARY" "$ISSUE_NUMBER" "$ISSUE_USER" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          # Another approval may have landed while this ran.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1

      - name: Say so on the issue
        if: success()
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.apply.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '**Applied and pushed to `main`.**',
                '',
                '```',
                process.env.SUMMARY,
                '```',
                '',
                'The site redeploys from that commit, so it will be live shortly. Thank you.',
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Say so if it failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                '**Could not apply this automatically.** See the run log linked above. ' +
                'Nothing was committed, so the dictionary is untouched.',
            });
            await github.rest.issues
              .removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'approved',
              })
              .catch(() => {});
